<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e242d"/>
      <stop offset="100%" stop-color="#0a0c0f"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect x="8" y="8" width="176" height="176" rx="42" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="3"/>
  <!-- Clock Flap Card 1 -->
  <rect x="28" y="46" width="60" height="100" rx="10" fill="#15181e" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>
  <line x1="28" y1="96" x2="88" y2="96" stroke="#000000" stroke-width="2"/>
  <text x="58" y="112" font-family="-apple-system, sans-serif" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle">10</text>
  <!-- Clock Flap Card 2 -->
  <rect x="104" y="46" width="60" height="100" rx="10" fill="#15181e" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>
  <line x1="104" y1="96" x2="164" y2="96" stroke="#000000" stroke-width="2"/>
  <text x="134" y="112" font-family="-apple-system, sans-serif" font-weight="900" font-size="52" fill="url(#accentGrad)" text-anchor="middle">24</text>
  <!-- Indicator dot -->
  <circle cx="96" cy="85" r="3.5" fill="#38bdf8"/>
  <circle cx="96" cy="107" r="3.5" fill="#38bdf8"/>
</svg>
